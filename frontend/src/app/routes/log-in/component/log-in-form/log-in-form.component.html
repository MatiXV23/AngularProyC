<div class="card">
    <form #loginForm="ngForm" (ngSubmit)="handleSubmit($event)">
        <label for="username">username</label><br>
        <input type="text" name="username" id="username" [(ngModel)]="this.credenciales.username"><br><br>

        <label for="password">password</label><br>
        <input type="password" name="password" id="password" [(ngModel)]="this.credenciales.password"><br><br>

        <input type="submit" value="Ingresar">
    </form>
</div>
